# Vitrinly kural tabanı v0 (başlangıç listesi)
# Tarih: 2026-10-25. Ayrıntı ve bağlam: pazaryeri-kurallari.md
# status: VERIFIED | SNIPPET | UNKNOWN
#   Bu sürümde hiçbir kural VERIFIED değil: resmi sayfalar ortamdan açılamadı.
#   SNIPPET kurallarında source alanı resmi alan adıysa güven yüksek, 3. tarafsa düşük.
# severity: block | warn
#   UNKNOWN veya 3. taraf kaynaklı kurallar bilerek "warn" seviyesinde tutuldu.
# platform: trendyol | hepsiburada | all

rules:
  # ---------- TITLE ----------
  - id: TY-TITLE-001
    platform: trendyol
    area: title
    rule: "Başlık (title) zorunlu ve en fazla 100 karakter."
    severity: block
    source: https://developers.trendyol.com/docs/%C3%BCr%C3%BCn-aktarma-v2createproducts
    status: SNIPPET
  - id: TY-TITLE-002
    platform: trendyol
    area: title
    rule: "Başlık ve açıklamada yalnızca ürünün kendi markası geçer; başka marka adı yazılmaz (Hatalı Marka Girişi -> ürün kapatma + ihlal puanı)."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/204
    status: SNIPPET
  - id: TY-TITLE-003
    platform: trendyol
    area: title
    rule: "Başlık, brand alanı ve görseldeki marka birbiriyle aynı olmalı."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/205
    status: SNIPPET
  - id: ALL-TITLE-004
    platform: all
    area: title
    rule: "Başka e-ticaret sitesinin adı veya URL'si başlıkta geçemez."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/204
    status: SNIPPET
  - id: TY-TITLE-005
    platform: trendyol
    area: title
    rule: "Başlık, aranan spesifik özellikleri (renk, malzeme, model, gramaj/beden) içermeli; eksikse öneri ver."
    severity: warn
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/49
    status: SNIPPET
  - id: HB-TITLE-001
    platform: hepsiburada
    area: title
    rule: "Başlık 255 karakteri geçmesin (resmi sınır doğrulanmadı; 150 karakter üstü için de uyar)."
    severity: warn
    source: https://birfatura.com/hepsiburada-urun-yukleme-yollari/
    status: SNIPPET
  - id: ALL-TITLE-006
    platform: all
    area: title
    rule: "Emoji, aşırı büyük harf (TÜM BÜYÜK kelimeler) ve dekoratif semboller kullanılmasın."
    severity: warn
    source: https://birfatura.com/hepsiburada-urun-yukleme-yollari/
    status: UNKNOWN
  - id: ALL-TITLE-007
    platform: all
    area: title
    rule: "Aynı kelime veya eş anlamlı anahtar kelime tekrarı (keyword stuffing) olmasın."
    severity: warn
    source: "resmi kaynak bulunamadı"
    status: UNKNOWN
  - id: TY-TITLE-008
    platform: trendyol
    area: title
    rule: "Model kodu en az 8 karakter; renk/beden varyantlarında aynı model kodu kullanılır."
    severity: warn
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/147
    status: SNIPPET

  # ---------- DESCRIPTION ----------
  - id: TY-DESC-001
    platform: trendyol
    area: description
    rule: "Açıklama zorunlu; HTML string; en fazla 30.000 karakter."
    severity: block
    source: https://developers.trendyol.com/docs/%C3%BCr%C3%BCn-aktarma-v2createproducts
    status: SNIPPET
  - id: ALL-DESC-002
    platform: all
    area: description
    rule: "Açıklamada telefon, e-posta, URL veya sosyal medya hesabı gibi dış mecraya yönlendiren bilgi olmasın."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/243
    status: UNKNOWN
  - id: TY-DESC-003
    platform: trendyol
    area: description
    rule: "Açıklamadaki renk, beden, malzeme ve ölçü bilgisi, yapılandırılmış özellik alanları ve görselle çelişmesin ('Açıklama ve görsel uyumsuz' ret sebebi)."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/349
    status: SNIPPET
  - id: TY-DESC-004
    platform: trendyol
    area: description
    rule: "Gıda ve takviye ürünlerinde TGK etiket bilgileri bulunmalı: gıdanın adı, bileşenler, net miktar, TETT/SKT, işletmeci unvanı ve adresi, işletme kayıt numarası."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
    status: SNIPPET
  - id: TY-DESC-005
    platform: trendyol
    area: description
    rule: "Elektronik ürünlerde garanti koşulları ve kurulum bilgisi bulunmalı."
    severity: warn
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
    status: SNIPPET
  - id: TY-DESC-006
    platform: trendyol
    area: description
    rule: "Barem, fiyat veya desi hakkında yanıltıcı bilgi verilmesin (ihlal puanı)."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/205
    status: SNIPPET
  - id: TY-QA-001
    platform: trendyol
    area: description
    rule: "Soru cevabı 10-2000 karakter olmalı; yasaklı kelime içermemeli; dış mecraya yönlendirmemeli; ilgisiz veya yanıltıcı olmamalı."
    severity: block
    source: https://developers.trendyol.com/docs/m%C3%BC%C5%9Fteri-sorular%C4%B1n%C4%B1-cevaplama
    status: SNIPPET

  # ---------- IMAGE ----------
  - id: TY-IMG-001
    platform: trendyol
    area: image
    rule: "Görsel 1200x1800 px (2:3), 96 dpi; https URL ile gönderilir; barkod başına en fazla 8 görsel."
    severity: block
    source: https://developers.trendyol.com/docs/%C3%BCr%C3%BCn-aktarma-v2createproducts
    status: SNIPPET
  - id: TY-IMG-002
    platform: trendyol
    area: image
    rule: "Görsel en az 600x800 px ve en fazla 10 MB olmalı."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
    status: SNIPPET
  - id: TY-IMG-003
    platform: trendyol
    area: image
    rule: "Görselde logo veya yazı olmamalı; kalite sorunu (bulanık, düşük çözünürlük) olmamalı."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/349
    status: SNIPPET
  - id: TY-IMG-004
    platform: trendyol
    area: image
    rule: "Görsel, satılan ürünle aynı renk, boyut ve marka özelliklerini taşımalı; AI düzenlemesi ürünün kendisini değiştirmemeli."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/204
    status: SNIPPET
  - id: TY-IMG-005
    platform: trendyol
    area: image
    rule: "Görselde başka marka veya e-ticaret sitesinin logosu ya da adı olmamalı."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/204
    status: SNIPPET
  - id: TY-IMG-006
    platform: trendyol
    area: image
    rule: "Görselde sağlık beyanı (metin veya ikon) olmamalı."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
    status: SNIPPET
  - id: TY-IMG-007
    platform: trendyol
    area: image
    rule: "Çocuk ürünlerinde çocuk vücudunu teşhir eden görsel olmamalı; insan model üretimi kapalı tutulmalı, manken veya düz serim kullanılmalı."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
    status: SNIPPET
  - id: TY-IMG-008
    platform: trendyol
    area: image
    rule: "Görseller satıcıya ait ya da telifsiz olmalı (başka satıcının fotoğrafı kullanılmamalı)."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/242
    status: SNIPPET
  - id: ALL-IMG-009
    platform: all
    area: image
    rule: "Ana görselde tek ürün olmalı; kolaj veya karışık görsel olmamalı."
    severity: warn
    source: https://idifo.com/blog/trendyol-gorsel-kurallari/
    status: SNIPPET
  - id: ALL-IMG-010
    platform: all
    area: image
    rule: "Görselde filigran, fiyat etiketi, indirim rozeti veya 'en çok satan' benzeri rozet olmamalı."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/349
    status: SNIPPET
  - id: HB-IMG-001
    platform: hepsiburada
    area: image
    rule: "Görsel en az 500x500 px; hedef kare ve 1200x1200 px veya üstü (resmi değer doğrulanmadı)."
    severity: warn
    source: https://www.emstudio.tr/hepsiburada-e-ticaret-fotograf-olculeri-2025-rehberi/
    status: SNIPPET
  - id: HB-IMG-002
    platform: hepsiburada
    area: image
    rule: "Ana görsel saf beyaz zeminde (RGB 255,255,255), gölgesiz olmalı; ürün karenin yaklaşık %85'ini kaplamalı."
    severity: warn
    source: https://www.meayt.com/blog/hepsiburada-urun-gorseli-boyutlari-ve-kurallari/
    status: SNIPPET
  - id: HB-IMG-003
    platform: hepsiburada
    area: image
    rule: "Görselde logo, yazı, filigran, ikon veya sosyal medya adresi olmamalı."
    severity: block
    source: https://www.meayt.com/blog/hepsiburada-urun-gorseli-boyutlari-ve-kurallari/
    status: SNIPPET
  - id: HB-IMG-004
    platform: hepsiburada
    area: image
    rule: "Format yalnızca JPG veya PNG; görsel URL'si herkese açık erişilebilir olmalı."
    severity: block
    source: https://developers.hepsiexpress.com/?docs=dokuman/entegrasyon/urun-bilgisi-gonderme
    status: SNIPPET
  - id: ALL-IMG-011
    platform: all
    area: image
    rule: "Gerçek kişi görünümlü AI insan üretilmesin. Üretilirse ürünü kullanıyor ya da tavsiye ediyor izlenimi vermesin ve 'yapay zekâ ile oluşturulmuştur' etiketi taşısın."
    severity: block
    source: https://www.rok.org.tr/haberler/ticari-reklam-ve-haksiz-ticari-uygulamalar-yonetmeligi-degisikligi/
    status: SNIPPET

  # ---------- CLAIM ----------
  - id: LAW-CLAIM-001
    platform: all
    area: claim
    rule: "Takviye edici gıda: hastalığı önleme, tedavi etme veya iyileştirme iddiası yasak (ör. 'tedavi eder', 'iyileştirir', 'kanseri önler', 'diyabete iyi gelir')."
    severity: block
    source: https://www.mevzuat.gov.tr/MevzuatMetin/yonetmelik/7.5.40155.pdf
    status: SNIPPET
  - id: LAW-CLAIM-002
    platform: all
    area: claim
    rule: "Takviye edici gıda: sağlık beyanı yalnızca izinli beyan listesinden veya TİTCK onaylı ifadeyle kullanılabilir; TEG onayı sağlık beyanını kapsamaz."
    severity: warn
    source: https://www.tisd.org.tr/Upload/mevzuat/611.pdf
    status: SNIPPET
  - id: LAW-CLAIM-003
    platform: all
    area: claim
    rule: "Takviye edici gıda: sağlık beyanı kapsamındaki konular karşılaştırılamaz (diğer karşılaştırmalı reklam yasağı 2026'da kaldırıldı)."
    severity: block
    source: https://www.rok.org.tr/haberler/ticari-reklam-ve-haksiz-ticari-uygulamalar-yonetmeligi-degisikligi/
    status: SNIPPET
  - id: LAW-CLAIM-004
    platform: all
    area: claim
    rule: "Takviye ürünlerinde zorunlu ifadeler: 'İlaç değildir', 'hastalıkların önlenmesi veya tedavi edilmesi amacıyla kullanılmaz', 'normal beslenmenin yerine geçemez' ve TEG onay numarası. Açıklamada yoksa uyar."
    severity: warn
    source: https://www.kizilkaya.com.tr/media/7581/TEG-y%C3%B6netmelik.pdf
    status: SNIPPET
  - id: LAW-CLAIM-005
    platform: all
    area: claim
    rule: "Kozmetik: tedavi edici, tıbbi ürünle karışacak veya 'hiçbir yan etkisi yoktur' türü iddia yasak."
    severity: block
    source: https://www.titck.gov.tr/duyuru/kozmetik-urunlere-iliskin-kilavuzlar-27122018173130
    status: SNIPPET
  - id: LAW-CLAIM-006
    platform: all
    area: claim
    rule: "Kozmetik: 'Bakanlık onaylı', 'TİTCK onaylı' gibi iddia ve görseller yasak."
    severity: block
    source: https://www.titck.gov.tr/duyuru/kozmetik-urunlere-iliskin-kilavuzlar-27122018173130
    status: SNIPPET
  - id: LAW-CLAIM-007
    platform: all
    area: claim
    rule: "Kozmetik: bileşen özelliğine atıf yapan iddia, ürün o özelliği taşımıyorsa kullanılamaz; '... içermez' iddialarının ayrıntılı kriteri doğrulanmadı."
    severity: warn
    source: https://www.titck.gov.tr/duyuru/kozmetik-urunlere-iliskin-kilavuzlar-27122018173130
    status: UNKNOWN
  - id: LAW-CLAIM-008
    platform: all
    area: claim
    rule: "Üstünlük ifadeleri ('en iyi', 'en etkili', '1 numara', 'Türkiye'nin en çok satan', 'garantili', '%100') ispat gerektirir; kanıt yoksa kaldır veya yumuşat."
    severity: warn
    source: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
    status: SNIPPET
  - id: LAW-CLAIM-009
    platform: all
    area: claim
    rule: "Karşılaştırmada rakip marka, logo veya ticaret unvanı kullanılamaz; karşılaştırma somut ve ölçülebilir veriye dayanmalı."
    severity: block
    source: https://tuketici.ticaret.gov.tr/data/5e819a8e13b876a1b04c7a4a/T%C4%B0CAR%C4%B0%20REKLAM%20VE%20HAKSIZ%20T%C4%B0CAR%C4%B0%20UYGULAMALAR%20Y%C3%96NETMEL%C4%B0%C4%9E%C4%B0.pdf
    status: SNIPPET
  - id: LAW-CLAIM-010
    platform: all
    area: claim
    rule: "Genel çevresel beyanlar ('çevre dostu', 'doğa dostu', 'yeşil', 'sürdürülebilir', 'eko') açıklama ve kanıt olmadan kullanılamaz."
    severity: warn
    source: https://ticaret.gov.tr/haberler/aldaticici-reklam-ve-haksiz-ticari-uygulamalarla-mucadelede-yeni-donem-basliyor
    status: SNIPPET
  - id: LAW-CLAIM-011
    platform: all
    area: claim
    rule: "Gerçeğe aykırı akademik unvan veya uzman tavsiyesi ('doktor önerisi', 'Prof. onaylı') kullanılamaz."
    severity: block
    source: https://ticaret.gov.tr/haberler/aldaticici-reklam-ve-haksiz-ticari-uygulamalarla-mucadelede-yeni-donem-basliyor
    status: SNIPPET
  - id: LAW-CLAIM-012
    platform: all
    area: claim
    rule: "Uydurma veya satın alınmamış müşteri yorumu ya da yorum alıntısı metne veya görsele konmasın."
    severity: block
    source: https://ticaret.gov.tr/haberler/ticaret-bakanligi-tarafindan-ticari-reklam-ve-haksiz-ticari-uygulamalar-yonetmeliginde-yapilan-degisikliklerle-tuketicilerin-aldatici-reklam-ve-ticari-uygulamalara-karsi-korunmasi-guclendiriliyor
    status: SNIPPET

  # ---------- PRICE ----------
  - id: LAW-PRICE-001
    platform: all
    area: price
    rule: "Üstü çizili (indirim öncesi) fiyat, indirimin başladığı tarihten önceki 10 gün içinde aynı satış kanalında uygulanan en düşük fiyattan yüksek olamaz (1.8.2026'dan itibaren; önceki kural 30 gündü)."
    severity: block
    source: https://ticaret.gov.tr/haberler/ticaret-bakanligindan-indirimli-satis-reklamlarinda-seffafligi-artiracak-yeni-duzenleme
    status: SNIPPET
  - id: LAW-PRICE-002
    platform: all
    area: price
    rule: "Çabuk bozulan mallarda referans fiyat, indirimden bir önceki fiyattır."
    severity: warn
    source: https://www.rok.org.tr/haberler/ticari-reklam-ve-haksiz-ticari-uygulamalar-yonetmeligi-degisikligi/
    status: SNIPPET
  - id: LAW-PRICE-003
    platform: all
    area: price
    rule: "Metin veya görselde indirim oranı ya da 'X TL yerine Y TL' ifadesi varsa, LAW-PRICE-001'e göre doğrulanabilir olmalı; doğrulanamıyorsa ifadeyi kaldır."
    severity: warn
    source: https://ticaret.gov.tr/haberler/ticaret-bakanligindan-indirimli-satis-reklamlarinda-seffafligi-artiracak-yeni-duzenleme
    status: SNIPPET
  - id: TY-PRICE-004
    platform: trendyol
    area: price
    rule: "Ürün indirimleri müşteriyi yanıltıcı olmamalı (ihlal puanı riski)."
    severity: block
    source: https://akademi.trendyol.com/satici-bilgi-merkezi/detay/205
    status: SNIPPET
